name: Sincronizar paquetes de Sancho

# SAN-2284: copia en paquetes/ los agentes y skills que sirve Sancho y regenera
# los stubs. Corre una vez al día y a mano; si nada cambió no hace commit.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-paquetes
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar los paquetes que cambiaron
        env:
          SANCHO_MCP_URL: ${{ vars.SANCHO_MCP_URL || 'https://app.sanchocmo.ai/api/mcp/sancho' }}
          SANCHO_MCP_TOKEN: ${{ secrets.SANCHO_MCP_TOKEN }}
        run: python3 scripts/sincronizar.py
      - name: Guardar en main
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nada cambió"; exit 0; fi
          git config user.name "sancho-agents-sync"
          git config user.email "sancho-agents-sync@users.noreply.github.com"
          git add -A paquetes agents
          git commit -m "chore: sincronizar paquetes de Sancho (SAN-2284)"
          git push
